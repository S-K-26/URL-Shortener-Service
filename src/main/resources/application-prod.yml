spring:
  application:
    name: url-shortener-service

    DataSource:
      url: h2:mem:testdb
      driverClassName: org.h2.Driver
      username: sa
      password: password
      platform: h2

    jpa:
        hibernate:
          dialect: org.hibernate.dialect.H2Dialect
          ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
            format_sql: true